name: Squad Triage

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    if: github.event.label.name == 'squad'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Triage issue via Lead agent
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.COPILOT_ASSIGN_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;

            const teamFile = '.squad/team.md';
            if (!fs.existsSync(teamFile)) {
              core.warning('No .squad/team.md found — cannot triage');
              return;
            }

            const content = fs.readFileSync(teamFile, 'utf8');
            const lines = content.split('\n');

            function slugify(text) {
              return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            }

            function parseMembers() {
              const members = [];
              let inMembersTable = false;
              for (const line of lines) {
                if (line.match(/^##\s+(Members|Team Roster)/i)) {
                  inMembersTable = true;
                  continue;
                }
                if (inMembersTable && line.startsWith('## ')) {
                  break;
                }
                if (inMembersTable && line.startsWith('|') && !line.includes('---') && !line.includes('Name')) {
                  const cells = line.split('|').map(c => c.trim()).filter(Boolean);
                  if (cells.length >= 3) {
                    members.push({
                      name: cells[0],
                      role: cells[1],
                      charter: cells[2],
                      label: `squad:${slugify(cells[0])}`
                    });
                  }
                }
              }
              return members;
            }

            function detectCopilotTier(issueText) {
              const goodFitKeywords = ['bug', 'fix', 'regression', 'test', 'coverage', 'lint', 'format', 'dependency', 'bump', 'docs', 'readme', 'documentation', 'scaffold', 'boilerplate'];
              const needsReviewKeywords = ['feature', 'refactor', 'endpoint', 'migration'];
              const notSuitableKeywords = ['architecture', 'design', 'security', 'auth', 'encryption', 'performance', 'benchmark'];

              if (notSuitableKeywords.some(keyword => issueText.includes(keyword))) {
                return 'not-suitable';
              }
              if (goodFitKeywords.some(keyword => issueText.includes(keyword))) {
                return 'good-fit';
              }
              if (needsReviewKeywords.some(keyword => issueText.includes(keyword))) {
                return 'needs-review';
              }
              return null;
            }

            function routeIssue(issueText, members) {
              const routes = [
                {
                  roleMatch: role => role.includes('core'),
                  keywords: ['core', 'schema', 'jsonl', 'profile', 'detector', 'validation', 'omlx', 'hugging face', 'hf cache'],
                  reason: 'Issue relates to core contracts, detectors, or profile/schema work'
                },
                {
                  roleMatch: role => role.includes('cli') || role.includes('harness'),
                  keywords: ['cli', 'command', 'terminal', 'tui', 'harness', 'vscode', 'copilot cli'],
                  reason: 'Issue relates to CLI, TUI, or harness surfaces'
                },
                {
                  roleMatch: role => role.includes('service'),
                  keywords: ['service', 'api', 'endpoint', 'blob', 'storage', 'middleware', 'rate limit', 'hostname', 'cidr'],
                  reason: 'Issue relates to service endpoints or storage/ops wiring'
                },
                {
                  roleMatch: role => role.includes('test'),
                  keywords: ['test', 'coverage', 'assert', 'acceptance', 'flaky', 'regression'],
                  reason: 'Issue relates to testing or verification'
                }
              ];

              for (const member of members) {
                const role = member.role.toLowerCase();
                for (const route of routes) {
                  if (route.roleMatch(role) && route.keywords.some(keyword => issueText.includes(keyword))) {
                    return { member, reason: route.reason };
                  }
                }
              }

              const lead = members.find(member => {
                const role = member.role.toLowerCase();
                return role.includes('lead') || role.includes('architect') || role.includes('coordinator');
              });

              return {
                member: lead || members[0],
                reason: 'No specific domain match — assigned to Lead for further analysis'
              };
            }

            function buildCopilotInstructions(ownerMember) {
              return [
                `This GitHub issue is being executed by @copilot on behalf of ${ownerMember.name} (${ownerMember.role}).`,
                '',
                'Read these first:',
                '- .github/copilot-instructions.md',
                '- .squad/team.md',
                '- .squad/routing.md',
                `- ${ownerMember.charter}`,
                '',
                'Persona handoff rules:',
                `- Treat ${ownerMember.label} as the authoritative squad-member identity for this issue.`,
                '- Ignore squad:copilot when choosing persona; it is the execution label only.',
                `- Work in ${ownerMember.name}'s voice and stay within the boundaries in ${ownerMember.charter}.`,
                `- In the PR body include: Working as ${ownerMember.name} (${ownerMember.role})`,
                '- If you spawn a follow-up session/subagent, pass through the same member name, role, label, and charter path.',
              ].join('\n');
            }

            async function assignCopilot(ownerMember) {
              const { data: repoData } = await github.rest.repos.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });

              await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/assignees', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                assignees: ['copilot-swe-agent[bot]'],
                agent_assignment: {
                  target_repo: `${context.repo.owner}/${context.repo.repo}`,
                  base_branch: repoData.default_branch,
                  custom_instructions: buildCopilotInstructions(ownerMember),
                  custom_agent: '',
                  model: ''
                },
                headers: {
                  'X-GitHub-Api-Version': '2022-11-28'
                }
              });
            }

            const members = parseMembers();
            if (members.length === 0) {
              core.warning('No squad members found in .squad/team.md — cannot triage');
              return;
            }

            const hasCopilot = content.includes('🤖 Coding Agent') || content.includes('| @copilot |');
            const copilotAutoAssign = content.includes('<!-- copilot-auto-assign: true -->');
            const issueText = `${issue.title}\n${issue.body || ''}`.toLowerCase();
            const routed = routeIssue(issueText, members);
            const ownerMember = routed.member;
            const copilotTier = hasCopilot ? detectCopilotTier(issueText) : null;
            const shouldAssignCopilot = Boolean(ownerMember && hasCopilot && copilotAutoAssign && ['good-fit', 'needs-review'].includes(copilotTier));

            const labels = new Set(['go:needs-research']);
            if (ownerMember?.label) {
              labels.add(ownerMember.label);
            }
            if (shouldAssignCopilot) {
              labels.add('squad:copilot');
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: Array.from(labels)
            });

            let assignmentStatus = 'No @copilot auto-assignment attempted.';
            if (shouldAssignCopilot) {
              try {
                await assignCopilot(ownerMember);
                assignmentStatus = `Assigned @copilot to execute as ${ownerMember.name} (${ownerMember.role}).`;
              } catch (err) {
                assignmentStatus = `⚠️ Failed to assign @copilot automatically: ${err.message}`;
                core.warning(assignmentStatus);
              }
            } else if (copilotTier === 'not-suitable') {
              assignmentStatus = '@copilot skipped — issue looks outside the coding-agent capability profile.';
            } else if (hasCopilot && !copilotAutoAssign) {
              assignmentStatus = '@copilot is on the roster, but auto-assign is disabled in .squad/team.md.';
            }

            const memberList = members.map(member =>
              `- **${member.name}** (${member.role}) → label: \`${member.label}\``
            ).join('\n');

            const comment = [
              '### 🏗️ Squad Triage',
              '',
              `**Issue:** #${issue.number} — ${issue.title}`,
              `**Owning squad member:** ${ownerMember.name} (${ownerMember.role})`,
              `**Owner label:** \`${ownerMember.label}\``,
              `**Routing reason:** ${routed.reason}`,
              shouldAssignCopilot ? `**Execution:** @copilot via \`squad:copilot\` (working as ${ownerMember.name})` : `**Execution:** ${ownerMember.name} picks this up directly`,
              copilotTier === 'needs-review' ? '⚠️ **PR review recommended** — this matched @copilot\'s needs-review tier.' : '',
              `**Assignment status:** ${assignmentStatus}`,
              '',
              '---',
              '',
              '**Team roster:**',
              memberList,
              hasCopilot ? '- **@copilot** (Coding Agent) → label: `squad:copilot` (execution label; pair with the owning `squad:{member}` label)' : '',
              '',
              '> To reassign, swap the owning `squad:{member}` label. Keep `squad:copilot` only when GitHub should execute the issue through @copilot.'
            ].filter(Boolean).join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: comment
            });

            core.info(`Triaged issue #${issue.number} → owner ${ownerMember.name}${shouldAssignCopilot ? ' + @copilot execution' : ''}`);
