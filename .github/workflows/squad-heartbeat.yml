name: Squad Heartbeat (Ralph)
# ⚠️ SYNC: This workflow is maintained in 4 locations. Changes must be applied to all:
#   - templates/workflows/squad-heartbeat.yml (source template)
#   - packages/squad-cli/templates/workflows/squad-heartbeat.yml (CLI package)
#   - .squad/templates/workflows/squad-heartbeat.yml (installed template)
#   - .github/workflows/squad-heartbeat.yml (active workflow)
# Run 'squad upgrade' to sync installed copies from source templates.

on:
  issues:
    types: [closed, labeled]
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  pull-requests: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check triage script
        id: check-script
        run: |
          if [ -f ".squad/templates/ralph-triage.js" ]; then
            echo "has_script=true" >> $GITHUB_OUTPUT
          else
            echo "has_script=false" >> $GITHUB_OUTPUT
            echo "⚠️ ralph-triage.js not found — run 'squad upgrade' to install"
          fi

      - name: Ralph — Smart triage
        if: steps.check-script.outputs.has_script == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .squad/templates/ralph-triage.js \
            --squad-dir .squad \
            --output triage-results.json

      - name: Ralph — Apply triage decisions
        if: steps.check-script.outputs.has_script == 'true' && hashFiles('triage-results.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'triage-results.json';
            if (!fs.existsSync(path)) {
              core.info('No triage results — board is clear');
              return;
            }

            const results = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (results.length === 0) {
              core.info('📋 Board is clear — Ralph found no untriaged issues');
              return;
            }

            for (const decision of results) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: decision.issueNumber,
                  labels: [decision.label]
                });

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: decision.issueNumber,
                  body: [
                    '### 🔄 Ralph — Auto-Triage',
                    '',
                    `**Assigned to:** ${decision.assignTo}`,
                    `**Reason:** ${decision.reason}`,
                    `**Source:** ${decision.source}`,
                    '',
                    '> Ralph auto-triaged this issue using routing rules.',
                    '> To reassign, swap the `squad:*` label.'
                  ].join('\n')
                });

                core.info(`Triaged #${decision.issueNumber} → ${decision.assignTo} (${decision.source})`);
              } catch (e) {
                core.warning(`Failed to triage #${decision.issueNumber}: ${e.message}`);
              }
            }

            core.info(`🔄 Ralph triaged ${results.length} issue(s)`);

      - name: Ralph — Assign @copilot issues
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.COPILOT_ASSIGN_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const teamFile = '.squad/team.md';
            if (!fs.existsSync(teamFile)) {
              core.info('No .squad/team.md found — skipping @copilot assignment');
              return;
            }

            const content = fs.readFileSync(teamFile, 'utf8');
            const lines = content.split('\n');
            const hasCopilot = content.includes('🤖 Coding Agent') || content.includes('| @copilot |');
            const autoAssign = content.includes('<!-- copilot-auto-assign: true -->');
            if (!hasCopilot || !autoAssign) {
              core.info('@copilot auto-assign is disabled or missing from the roster');
              return;
            }

            function slugify(text) {
              return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            }

            function labelNames(labels) {
              return (labels || []).map(label => typeof label === 'string' ? label : label.name).filter(Boolean);
            }

            const members = [];
            let inMembersTable = false;
            for (const line of lines) {
              if (line.match(/^##\s+(Members|Team Roster)/i)) {
                inMembersTable = true;
                continue;
              }
              if (inMembersTable && line.startsWith('## ')) {
                break;
              }
              if (inMembersTable && line.startsWith('|') && !line.includes('---') && !line.includes('Name')) {
                const cells = line.split('|').map(c => c.trim()).filter(Boolean);
                if (cells.length >= 3) {
                  members.push({
                    name: cells[0],
                    role: cells[1],
                    charter: cells[2],
                    label: `squad:${slugify(cells[0])}`
                  });
                }
              }
            }

            function findOwnerMember(labels) {
              const names = labelNames(labels);
              return members.find(member => names.includes(member.label)) || null;
            }

            function buildCopilotInstructions(member) {
              return [
                `This GitHub issue is being executed by @copilot on behalf of ${member.name} (${member.role}).`,
                '',
                'Read these first:',
                '- .github/copilot-instructions.md',
                '- .squad/team.md',
                '- .squad/routing.md',
                `- ${member.charter}`,
                '',
                'Persona handoff rules:',
                `- Treat ${member.label} as the authoritative squad-member identity for this issue.`,
                '- Ignore squad:copilot when choosing persona; it is the execution label only.',
                `- Work in ${member.name}'s voice and stay within the boundaries in ${member.charter}.`,
                `- In the PR body include: Working as ${member.name} (${member.role})`,
                '- If you spawn a follow-up session/subagent, pass through the same member name, role, label, and charter path.',
              ].join('\n');
            }

            const { data: copilotIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'squad:copilot',
              state: 'open',
              per_page: 20
            });

            const pending = copilotIssues.filter(issue => {
              const assignees = (issue.assignees || []).map(assignee => assignee.login);
              return !assignees.includes('copilot-swe-agent[bot]') && !assignees.includes('copilot-swe-agent');
            });

            if (pending.length === 0) {
              core.info('No unassigned squad:copilot issues');
              return;
            }

            const { data: repoData } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            for (const issue of pending) {
              const ownerMember = findOwnerMember(issue.labels);
              if (!ownerMember) {
                core.warning(`Skipping #${issue.number} — squad:copilot requires a paired owning squad:{member} label`);
                continue;
              }

              try {
                await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/assignees', {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  assignees: ['copilot-swe-agent[bot]'],
                  agent_assignment: {
                    target_repo: `${context.repo.owner}/${context.repo.repo}`,
                    base_branch: repoData.default_branch,
                    custom_instructions: buildCopilotInstructions(ownerMember),
                    custom_agent: '',
                    model: ''
                  },
                  headers: {
                    'X-GitHub-Api-Version': '2022-11-28'
                  }
                });
                core.info(`Assigned @copilot to #${issue.number} as ${ownerMember.name}`);
              } catch (e) {
                core.warning(`Failed to assign @copilot to #${issue.number}: ${e.message}`);
              }
            }
