name: Publish and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Skip deployment to Container Apps (test build only)"
        required: false
        default: "false"

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}
  IMAGE_NAME: mlx-pep

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish for linux-x64
        run: |
          dotnet publish src/MlxPep.Service \
            -c Release \
            -p:PublishSingleFile=true \
            -p:SelfContained=true \
            -r linux-x64 \
            -o publish/x64
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "true"

      - name: Publish for linux-arm64
        run: |
          dotnet publish src/MlxPep.Service \
            -c Release \
            -p:PublishSingleFile=true \
            -p:SelfContained=true \
            -r linux-arm64 \
            -o publish/arm64
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "true"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Extract commit SHA (short)
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/MlxPep.Service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.timestamp }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Log Docker image details
        run: |
          echo "Image pushed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "Tags:"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_short }}"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.timestamp }}"

  deploy-to-container-apps:
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.event_name == 'push' || github.event.inputs.skip_deploy != 'true'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure CLI login (OIDC)
        uses: azure/login@v1
        with:
          client-id: 5726df39-f34e-4ec8-b8a3-4287cd793394
          tenant-id: bbdb7146-4bdb-4eae-b50d-ff09b9d191b5
          subscription-id: de345105-2ffc-4619-a6bc-9c41dec93241
          auth-type: OIDC

      - name: Extract commit SHA (short)
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Update Container Apps with new image
        run: |
          az containerapp update \
            --resource-group mlx-pep-rg \
            --name mlx-pep-api \
            --image ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/mlx-pep:${{ steps.meta.outputs.sha_short }} \
            --no-wait

      - name: Wait for deployment to complete
        run: |
          echo "Waiting for Container Apps to stabilize (30 seconds)..."
          sleep 30

      - name: Health check - verify /health endpoint
        run: |
          CONTAINER_APP_URL=$(az containerapp show \
            --resource-group mlx-pep-rg \
            --name mlx-pep-api \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          
          echo "Container App URL: https://${CONTAINER_APP_URL}"
          
          # Retry health check up to 5 times
          for attempt in {1..5}; do
            echo "Health check attempt $attempt/5..."
            if curl -f -s "https://${CONTAINER_APP_URL}/health" > /dev/null 2>&1; then
              echo "✓ Health check passed!"
              exit 0
            fi
            sleep 5
          done
          
          echo "✗ Health check failed after 5 attempts"
          exit 1

      - name: Log deployment success
        if: success()
        run: |
          echo "✓ Deployment successful"
          echo "Deployed image: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/mlx-pep:${{ steps.meta.outputs.sha_short }}"
          echo "Health endpoint verified"

      - name: Rollback on health check failure
        if: failure()
        run: |
          echo "⚠ Health check failed. Attempting rollback to previous revision..."
          # Get the previous revision
          PREVIOUS_REVISION=$(az containerapp revision list \
            --resource-group mlx-pep-rg \
            --name mlx-pep-api \
            --query "[1].name" \
            -o tsv)
          
          if [ -n "$PREVIOUS_REVISION" ]; then
            az containerapp update \
              --resource-group mlx-pep-rg \
              --name mlx-pep-api \
              --revision-suffix "rollback"
            echo "Rolled back to previous revision: $PREVIOUS_REVISION"
          else
            echo "No previous revision available for rollback"
          fi
          exit 1
